  (function(){
    try{
      var t = localStorage.getItem('room_theme_v1');
      if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);

<style>
  :root{
    --pri:#6C5CE7; --priD:#5847D1; --pri-soft:#EFEBFF;
    --accent:#FF7A6B; --accent-soft:#FFEDEA;
    --good:#1FB781; --good-soft:#E3FBF1;
    --bg:#F6F5FC; --surface:#FFFFFF; --surface-2:#F1EFFB; --border:#E7E4F6;
    --text:#1B1730; --text-muted:#6B6784; --text-subtle:#9F9BB8;
    --on-btn:#FFFFFF;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --pri:#8B7FFF; --priD:#7A6BFF; --pri-soft:#2A2555;
    --accent:#FF9689; --accent-soft:#3A2333;
    --good:#3FE0A5; --good-soft:#173B33;

    --text:#EEEBFB; --text-muted:#B2AED4; --text-subtle:#7D79A6;
    --on-btn:#FFFFFF;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:'Anuphan',system-ui,sans-serif; color:var(--text); background:var(--bg);
    -webkit-text-size-adjust:100%; transition:background-color .25s ease, color .25s ease; }
  input,select,textarea,button{ font-family:inherit; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  @keyframes fadeUp{ from{ transform:translateY(10px); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes scaleIn{ from{ opacity:0; transform:scale(.92); } to{ opacity:1; transform:scale(1); } }
  @keyframes logoPop{ from{ transform:scale(.4) rotate(-14deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }

  @keyframes spin180{ from{ transform:rotate(0); } to{ transform:rotate(180deg); } }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(108,92,231,.38); } 50%{ box-shadow:0 0 0 7px rgba(108,92,231,0); } }
  .fade-in{ animation:fadeUp .32s cubic-bezier(.2,.8,.2,1) both; }
  .scale-in{ animation:scaleIn .18s cubic-bezier(.2,.8,.2,1); }

  .shell{ max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }

  .navbar{ background:linear-gradient(135deg,var(--pri),var(--priD)); border-radius:999px; display:flex; padding:5px; gap:3px;

  .sheet.modal-center{ justify-content:center; align-items:center; padding:20px; }
  .sheetin{ background:var(--bg); border-radius:22px 22px 0 0; max-height:92%; display:flex; flex-direction:column; overflow:hidden;

  .sched-table th{ background:var(--surface-2); font-weight:700; color:var(--text-muted); font-size:11px; }
  .sched-time{ font-size:9.5px; color:var(--text-subtle); font-weight:500; margin-top:1px; }
  .sched-corner{ position:sticky; left:0; z-index:2; min-width:56px; }

  tr.sched-today td{ background:rgba(108,92,231,.05); }
  .sched-blank{ color:var(--text-subtle); }
  .sched-now{ position:relative; background:var(--pri-soft) !important; font-weight:700; color:var(--pri);
    border-radius:9px; animation:glowPulse 2.2s ease-in-out infinite; }
  .day-pill{ padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600; border:1px solid var(--border);
    background:var(--surface); color:var(--text); cursor:pointer; flex:none; }
  .day-pill.on{ background:linear-gradient(135deg,var(--pri),var(--priD)); color:#fff; border-color:transparent; }
  .period-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .period-row .no{ width:26px; flex:none; font-size:12px; font-weight:700; color:var(--text-muted); text-align:center; }

var SESS_KEY = "room_session_v1";
var THEME_KEY = "room_theme_v1";

function deviceId(){
  var d=null;
  try{ d=localStorage.getItem(DEV_KEY); }catch(e){}
  if(!d){
    var a=new Uint8Array(12);
    (window.crypto||window.msCrypto).getRandomValues(a);
    d=""; for(var i=0;i<a.length;i++){ var h=a[i].toString(16); d+=(h.length<2?"0":"")+h; }
    try{ localStorage.setItem(DEV_KEY,d); }catch(e){}
  }
  return d;
}
function loadSession(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||"null"); }catch(e){ return null; } }
function saveSession(v){ try{ localStorage.setItem(SESS_KEY, JSON.stringify(v)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESS_KEY); }catch(e){} }

function api(action, payload){
  var body = Object.assign({ action:action, device:deviceId() }, S.session?{username:S.session.username}:{}, payload||{});
  return fetch(API_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, error:"เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต" }; });
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function relDate(iso){
  var d=new Date(iso); if(isNaN(d)) return "";
  var s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return "เมื่อครู่นี้";
  if(s<3600) return Math.floor(s/60)+" นาทีที่แล้ว";
  if(s<86400) return Math.floor(s/3600)+" ชม.ที่แล้ว";
  if(s<2592000) return Math.floor(s/86400)+" วันที่แล้ว";
  return d.getDate()+"/"+(d.getMonth()+1)+"/"+(d.getFullYear()+543);
}
function parseTimeRange(str){
  var m = String(str||"").match(/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/);
  if(!m) return null;
  return { s:(+m[1])*60+(+m[2]), e:(+m[3])*60+(+m[4]) };
}
function isNowInRange(str,nowMin){ var r=parseTimeRange(str); return r ? (nowMin>=r.s && nowMin<=r.e) : false; }

function isAdmin(){ return S.session && S.session.role==="admin"; }
function toast(msg){
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },2600);
}

/* ═══ โหลดข้อมูล ═══ */
function refreshAll(){
  return Promise.all([
    api("listAnnouncements",{}), api("listPolls",{}), api("listPosts",{}),
    isAdmin() ? api("listAccounts",{}) : Promise.resolve({ok:true,items:[]}),
    api("getSchedule",{})
  ]).then(function(r){
    if(r[0].ok) S.announcements=r[0].items;
    if(r[1].ok) S.polls=r[1].items;
    if(r[2].ok) S.posts=r[2].items;
    if(r[3].ok) S.accounts=r[3].items;
    if(r[4].ok) S.schedule=r[4].data;
    render();
  });
}

/* ═══ RENDER ═══ */
function render(){
  var titles={
    feed:{k:"ฟีดของห้อง", t:"โพสต์ล่าสุด"},
    ann:{k:"ข่าวสาร", t:"ประกาศ"},
    poll:{k:"มีส่วนร่วม", t:"โหวต"},
    sched:{k:"วันนี้เรียนอะไร", t:"ตารางเรียน"},
    acct:{k:"จัดการ", t:"บัญชีผู้ใช้"}
  };
  var tt=titles[S.tab]||titles.feed;
  document.getElementById("kicker").textContent=tt.k;
  document.getElementById("tabtitle").textContent=tt.t;
  document.getElementById("whoName").textContent=S.session?S.session.displayName:"";
  document.getElementById("whoRole").textContent=S.session? (isAdmin()?"แอดมิน":"นักเรียน") : "";

  var navDefs=[{k:"feed",l:"ฟีด"},{k:"ann",l:"ประกาศ"},{k:"poll",l:"โหวต"},{k:"sched",l:"ตาราง"}];
  if(isAdmin()) navDefs.push({k:"acct",l:"บัญชี"});
  document.getElementById("nav").innerHTML=navDefs.map(function(n){
    return '<button class="navbtn'+(S.tab===n.k?" on":"")+'" onclick="A.tab(\''+n.k+'\')">'+n.l+'</button>';
  }).join("");

  var v=document.getElementById("view");
  var top=v.scrollTop;
  if(S.tab==="feed") v.innerHTML=viewFeed();
  else if(S.tab==="ann") v.innerHTML=viewAnn();
  else if(S.tab==="poll") v.innerHTML=viewPoll();
  else if(S.tab==="sched") v.innerHTML=viewSchedule();
  else if(S.tab==="acct" && isAdmin()) v.innerHTML=viewAccounts();
  v.scrollTop=top;

  renderOverlays();
}
function addBtn(label, action){
  return '<button class="btn fade-in" style="width:100%;justify-content:center;" onclick="'+action+'">＋ '+label+'</button>';
}
function stagger(i){ return ' style="animation-delay:'+(i*45)+'ms"'; }

/* ── ฟีดโพสต์ ── */
function viewFeed(){
  var h="";
  if(isAdmin()) h+=addBtn("สร้างโพสต์ใหม่","A.openComposer('post')");
  if(!S.posts.length){
    h+='<div class="empty fade-in"><div class="ic">📭</div>ยังไม่มีโพสต์ในฟีด</div>';
  } else {
    S.posts.forEach(function(p,i){
      h+='<div class="card fade-in"'+stagger(i)+'>'+
           (isAdmin()?'<div style="display:flex;justify-content:flex-end;"><button class="x" onclick="A.del(\'deletePost\',\''+p.id+'\')">✕</button></div>':'')+
           (p.title?'<div style="font-size:15px;font-weight:700;margin-bottom:4px;">'+esc(p.title)+'</div>':'')+
           '<div style="font-size:14px;line-height:1.7;white-space:pre-wrap;">'+esc(p.body)+'</div>'+
           '<div class="muted" style="margin-top:8px;">'+relDate(p.createdAt)+'</div>'+
         '</div>';
    });
  }
  return '<div class="stack">'+h+'</div>';
}

/* ── ประกาศ ── */

/* ── โหวต ── */
function viewPoll(){
  var h="";
  if(isAdmin()) h+=addBtn("สร้างโหวตใหม่","A.openComposer('poll')");
  if(!S.polls.length){
    h+='<div class="empty fade-in"><div class="ic">🗳️</div>ยังไม่มีโหวต</div>';
  } else {
    S.polls.forEach(function(p,i){
      var showResult = p.closed || p.mine!=null;
      h+='<div class="card fade-in"'+stagger(i)+'>'+
           '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'+
             '<div style="font-size:15px;font-weight:700;line-height:1.35;flex:1;min-width:0;">'+esc(p.question)+'</div>'+
             '<span class="chip" style="flex:none;background:'+(p.closed?'var(--surface-2)':'var(--good-soft)')+';color:'+(p.closed?'var(--text-muted)':'var(--good)')+';">'+(p.closed?"ปิดแล้ว":"เปิดโหวต")+'</span>'+
           '</div>'+
           '<div class="muted" style="margin-top:4px;">'+p.total+' คนโหวตแล้ว · '+relDate(p.createdAt)+'</div>'+
           '<div style="margin-top:12px;">';
      p.options.forEach(function(opt,i2){
        if(showResult){
          var pct = p.total? Math.round((p.counts[i2]/p.total)*100) : 0;
          var mine = p.mine===i2;
          h+='<div style="margin-bottom:10px;">'+
               '<div class="row" style="justify-content:space-between;font-size:13px;margin-bottom:5px;">'+
                 '<span style="font-weight:'+(mine?"700":"500")+';color:'+(mine?"var(--pri)":"var(--text)")+';">'+(mine?"✓ ":"")+esc(opt)+'</span>'+
                 '<span class="muted">'+p.counts[i2]+' ('+pct+'%)</span>'+
               '</div>'+
               '<div class="bar"><div style="width:'+pct+'%;"></div></div>'+
             '</div>';
        } else {
          h+='<button class="optbtn" onclick="A.vote(\''+p.id+'\','+i2+')">'+esc(opt)+'</button>';
        }
      });
      h+='</div>';
      if(isAdmin()){
        h+='<div class="row" style="margin-top:6px;">'+
             '<button class="btn sm ghost" style="flex:1;" onclick="A.act(\'closePoll\',{id:\''+p.id+'\'})">'+(p.closed?"เปิดโหวตอีกครั้ง":"ปิดรับโหวต")+'</button>'+
             '<button class="btn sm danger" onclick="A.del(\'deletePoll\',\''+p.id+'\')">ลบ</button>'+
           '</div>';
      }
      h+='</div>';
    });
  }
  return '<div class="stack">'+h+'</div>';
}

/* ── ตารางเรียน ── */
function viewSchedule(){
  var sc = S.schedule;
  if(!sc){
    var h='<div class="empty fade-in"><div class="ic">🗓️</div>ยังไม่ได้ตั้งตารางเรียน</div>';
    if(isAdmin()) h+=addBtn("สร้างตารางเรียน (มีตัวอย่างให้แล้ว)","A.initSchedule()");
    return '<div class="stack">'+h+'</div>';
  }
  var todayIdx = (new Date().getDay()+6)%7; // 0=จันทร์..6=อาทิตย์
  var nowMin = (function(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); })();
  var h = '<div class="card sched-head fade-in">'+
      '<div class="sched-title">'+esc(sc.title)+'</div>'+
      (isAdmin()?'<button class="btn sm ghost" style="flex:none;" onclick="A.openScheduleEditor()">✎ แก้ไข</button>':'')+
    '</div>';
  h += '<div class="sched-scroll fade-in"><table class="sched-table"><thead><tr><th class="sched-corner">วัน</th>';
  sc.periods.forEach(function(p,pi){
    h += '<th>คาบ '+(pi+1)+'<div class="sched-time mono">'+esc(p.time)+'</div></th>';
  });
  h += '</tr></thead><tbody>';
  sc.days.forEach(function(day,di){
    var isToday = di===todayIdx;
    h += '<tr class="'+(isToday?"sched-today":"")+'"><td class="sched-day">'+esc(day)+'</td>';
    sc.periods.forEach(function(p,pi){
      var text = sc.cells[di+"-"+pi] || "";
      var live = isToday && isNowInRange(p.time, nowMin);
      h += '<td class="'+(live?"sched-now":"")+'">'+(text?esc(text):'<span class="sched-blank">—</span>')+'</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="muted fade-in" style="text-align:center;">ปัดซ้าย-ขวาเพื่อดูคาบถัดไป · ช่องไฮไลต์ = คาบที่กำลังเรียนอยู่ตอนนี้</div>';
  return '<div class="stack">'+h+'</div>';
}

  var c=S.composer; if(!c) return "";
  var title={ann:"สร้างประกาศ", post:"สร้างโพสต์", poll:"สร้างโหวต", account:"เพิ่มบัญชี"}[c.type];
  var body="";
  if(c.type==="ann"){
    body='<label class="lbl">หัวข้อ</label>'+
         '<input class="in" value="'+esc(c.title||"")+'" oninput="A.cf(\'title\',this.value)" style="margin:6px 0 12px;">'+
         '<label class="lbl">รายละเอียด (ไม่บังคับ)</label>'+
         '<textarea class="in" oninput="A.cf(\'body\',this.value)" style="margin:6px 0 12px;">'+esc(c.body||"")+'</textarea>'+
         '<label class="row" style="gap:8px;font-size:13.5px;"><input type="checkbox" '+(c.pinned?"checked":"")+' onchange="A.cf(\'pinned\',this.checked)"> ปักหมุดไว้บนสุด</label>';
  } else if(c.type==="post"){
    body='<label class="lbl">หัวข้อ (ไม่บังคับ)</label>'+
         '<input class="in" value="'+esc(c.title||"")+'" oninput="A.cf(\'title\',this.value)" style="margin:6px 0 12px;">'+
         '<label class="lbl">เนื้อหา</label>'+
         '<textarea class="in" oninput="A.cf(\'body\',this.value)" style="margin:6px 0;">'+esc(c.body||"")+'</textarea>';
  } else if(c.type==="poll"){
    var opts=c.options||["",""];
    body='<label class="lbl">คำถาม</label>'+
         '<input class="in" value="'+esc(c.question||"")+'" oninput="A.cf(\'question\',this.value)" style="margin:6px 0 12px;">'+
         '<label class="lbl">ตัวเลือก</label>'+
         '<div style="display:flex;flex-direction:column;gap:8px;margin:6px 0 10px;">'+
           opts.map(function(o,i){
             return '<div class="row"><input class="in" value="'+esc(o)+'" placeholder="ตัวเลือกที่ '+(i+1)+'" oninput="A.cfOpt('+i+',this.value)">'+
               (opts.length>2?'<button class="x" onclick="A.cfOptDel('+i+')">✕</button>':'')+'</div>';
           }).join("")+
         '</div>'+
         (opts.length<6?'<button class="btn sm ghost" onclick="A.cfOptAdd()">＋ เพิ่มตัวเลือก</button>':'');
  } else if(c.type==="account"){
    body='<label class="lbl">ชื่อผู้ใช้ (a-z, 0-9, . _ -)</label>'+
         '<input class="in" value="'+esc(c.username||"")+'" oninput="A.cf(\'username\',this.value)" style="margin:6px 0 12px;" autocapitalize="off">'+
         '<label class="lbl">ชื่อที่แสดง</label>'+
         '<input class="in" value="'+esc(c.displayName||"")+'" oninput="A.cf(\'displayName\',this.value)" style="margin:6px 0 12px;">'+
         '<label class="lbl">รหัสผ่านเริ่มต้น</label>'+
         '<input class="in" value="'+esc(c.password||"")+'" oninput="A.cf(\'password\',this.value)" style="margin:6px 0 12px;">'+
         '<label class="row" style="gap:8px;font-size:13.5px;"><input type="checkbox" '+(c.role==="admin"?"checked":"")+' onchange="A.cf(\'role\',this.checked?\'admin\':\'user\')"> ให้สิทธิ์แอดมิน</label>';
  }
  return '<div class="sheet"><div class="sheetin scale-in">'+
    '<div class="sheethead"><div style="font-size:16px;font-weight:700;">'+title+'</div><button class="x" onclick="A.closeComposer()">✕</button></div>'+
    '<div class="sheetbody">'+body+
      (c.err?'<div class="err" style="text-align:left;margin-top:4px;color:var(--accent);font-weight:600;">'+esc(c.err)+'</div>':'')+
      '<button class="btn" style="width:100%;margin-top:16px;padding:13px;" '+(S.busy?"disabled":"")+' onclick="A.submitComposer()">บันทึก</button>'+
    '</div>'+
  '</div></div>';
}

/* ── แก้ไขตารางเรียน (แอดมิน) ── */
function scheduleEditorSheet(){
  var sc=S.schedEdit; if(!sc) return "";
  var di=sc.day||0;
  var h='<div class="sheet"><div class="sheetin scale-in" style="max-height:95%;">'+
    '<div class="sheethead"><div style="font-size:16px;font-weight:700;">แก้ไขตารางเรียน</div><button class="x" onclick="A.seCancel()">✕</button></div>'+
    '<div class="sheetbody">';
  h+='<label class="lbl">ชื่อตาราง</label>'+
     '<input class="in" value="'+esc(sc.title)+'" oninput="A.seTitle(this.value)" style="margin:6px 0 16px;">';

  h+='<label class="lbl">คาบเรียน (เวลา)</label>'+
     '<div style="margin:8px 0 6px;">';
  sc.periods.forEach(function(p,i){
    h+='<div class="period-row"><span class="no">'+(i+1)+'</span>'+
       '<input class="in mono" value="'+esc(p.time)+'" placeholder="08.40-09.30" oninput="A.sePeriodTime('+i+',this.value)" style="flex:1;padding:8px 10px;font-size:13px;">'+
       (sc.periods.length>1?'<button class="x" onclick="A.seDelPeriod('+i+')">✕</button>':'')+
       '</div>';
  });
  h+='</div><button class="btn sm ghost" onclick="A.seAddPeriod()">＋ เพิ่มคาบ</button>';

  h+='<label class="lbl" style="display:block;margin-top:18px;">เลือกวันที่จะแก้เนื้อหา</label>'+
     '<div class="row" style="flex-wrap:wrap;margin:8px 0 14px;gap:7px;">'+
       sc.days.map(function(d,i){ return '<button class="day-pill'+(i===di?" on":"")+'" onclick="A.seDay('+i+')">'+esc(d)+'</button>'; }).join("")+
     '</div>';

  h+='<div class="muted" style="margin-bottom:8px;">พิมพ์เนื้อหาแต่ละคาบของวัน'+esc(sc.days[di])+' (ขึ้นบรรทัดใหม่ได้ เช่น รหัสวิชา / ชื่อครู / ห้อง)</div>';
  sc.periods.forEach(function(p,pi){
    var key=di+"-"+pi;
    h+='<div style="margin-bottom:10px;">'+
         '<div class="muted mono" style="margin-bottom:4px;">คาบ '+(pi+1)+' • '+esc(p.time)+'</div>'+
         '<textarea class="in" style="min-height:56px;font-size:13.5px;" oninput="A.seCell('+pi+',this.value)">'+esc(sc.cells[key]||"")+'</textarea>'+
       '</div>';
  });

  h+='<div class="row" style="margin-top:16px;">'+
       '<button class="btn ghost" style="flex:1;" onclick="A.seCancel()">ยกเลิก</button>'+
       '<button class="btn" style="flex:1;" onclick="A.seSave()">บันทึกตาราง</button>'+
     '</div>';
  h+='</div></div></div>';
  return h;
}

/* ═══════════ ACTIONS ═══════════ */
var A={
  tab:function(k){ S.tab=k; render(); document.getElementById("view").scrollTop=0; },

  openComposer:function(type){ S.composer = { type:type, options: type==="poll"?["",""]:undefined, err:"" }; render(); },
  closeComposer:function(){ S.composer=null; render(); },
  cf:function(k,v){ if(S.composer) S.composer[k]=v; },
  cfOpt:function(i,v){ S.composer.options[i]=v; },
  cfOptAdd:function(){ S.composer.options.push(""); render(); },
  cfOptDel:function(i){ S.composer.options.splice(i,1); render(); },
  submitComposer:function(){
    var c=S.composer; if(!c || S.busy) return;
    S.busy=true; c.err="";
    var call;
    if(c.type==="ann") call=api("createAnnouncement",{title:c.title,body:c.body,pinned:!!c.pinned});
    else if(c.type==="post") call=api("createPost",{title:c.title,body:c.body});
    else if(c.type==="poll") call=api("createPoll",{question:c.question,options:c.options});
    else if(c.type==="account") call=api("createAccount",{newUsername:c.username,displayName:c.displayName,password:c.password,role:c.role});
    call.then(function(r){
      S.busy=false;
      if(!r.ok){ c.err=r.error||"ทำรายการไม่สำเร็จ"; render(); return; }
      S.composer=null; toast("บันทึกแล้ว"); refreshAll();
    });
  },

  act:function(action,payload){
    if(S.busy) return; S.busy=true;
    api(action,payload).then(function(r){
      S.busy=false;
      if(!r.ok){ toast(r.error||"ทำรายการไม่สำเร็จ"); return; }
      refreshAll();
    });
  },
  del:function(action,id,key){
    A.askConfirm("ยืนยันการลบ? การลบนี้ย้อนกลับไม่ได้", function(){
      var payload={}; payload[key||"id"]=id;
      A.act(action,payload);
    });
  },
  vote:function(pollId,idx){ A.act("vote",{pollId:pollId,optionIndex:idx}); },
  resetPass:function(username){ S.resetPassDlg={target:username, value:""}; render(); },
  rpVal:function(v){ S.resetPassDlg.value=v; },
  rpCancel:function(){ S.resetPassDlg=null; render(); },
  rpSave:function(){
    var d=S.resetPassDlg; if(!d) return;
    if(!d.value || d.value.length<4){ toast("รหัสผ่านสั้นเกินไป"); return; }
    api("resetPassword",{target:d.target, newPassword:d.value}).then(function(r){
      if(!r.ok){ toast(r.error||"ทำรายการไม่สำเร็จ"); return; }
      S.resetPassDlg=null; toast("ตั้งรหัสใหม่แล้ว"); render();
    });
  },

  askConfirm:function(msg,cb){ S.confirmDlg={msg:msg,cb:cb}; render(); },
  confirmYes:function(){ var cb=S.confirmDlg&&S.confirmDlg.cb; S.confirmDlg=null; render(); if(cb) cb(); },
  confirmNo:function(){ S.confirmDlg=null; render(); },

  /* ตารางเรียน */
  initSchedule:function(){ S.schedEdit=JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)); S.schedEdit.day=0; render(); },
  openScheduleEditor:function(){ S.schedEdit=JSON.parse(JSON.stringify(S.schedule)); S.schedEdit.day=0; render(); },
  seCancel:function(){ S.schedEdit=null; render(); },
  seTitle:function(v){ S.schedEdit.title=v; },
  seDay:function(i){ S.schedEdit.day=i; render(); },
  sePeriodTime:function(i,v){ S.schedEdit.periods[i].time=v; },
  seAddPeriod:function(){ S.schedEdit.periods.push({time:""}); render(); },
  seDelPeriod:function(i){
    S.schedEdit.periods.splice(i,1);
    var nc={};
    Object.keys(S.schedEdit.cells).forEach(function(k){
      var parts=k.split("-"), d=+parts[0], p=+parts[1];
      if(p===i) return;
      nc[d+"-"+(p>i?p-1:p)] = S.schedEdit.cells[k];
    });
    S.schedEdit.cells=nc; render();
  },
  seCell:function(pi,v){ S.schedEdit.cells[S.schedEdit.day+"-"+pi]=v; },
  seSave:function(){
    var sc=S.schedEdit;
    if(!sc.title.trim()){ toast("ใส่ชื่อตารางก่อน"); return; }
    if(!sc.periods.length){ toast("ต้องมีอย่างน้อย 1 คาบ"); return; }
    S.busy=true;
    api("saveSchedule",{data: JSON.stringify({title:sc.title, periods:sc.periods, days:sc.days, cells:sc.cells})}).then(function(r){
      S.busy=false;
      if(!r.ok){ toast(r.error||"บันทึกไม่สำเร็จ"); return; }
      S.schedule={title:sc.title, periods:sc.periods, days:sc.days, cells:sc.cells};
      S.schedEdit=null; toast("บันทึกตารางเรียนแล้ว"); render();
    });
  },

  toggleTheme:function(){
    var cur=document.documentElement.getAttribute("data-theme")||"light";
    var next=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
    updateThemeIcon(true);
  },

  logout:function(){
    A.askConfirm("ต้องการออกจากระบบใช่ไหม?", function(){ clearSession(); S.session=null; location.reload(); });
  }
};
window.A=A;

function updateThemeIcon(anim){
  var btn=document.getElementById("themeBtn"); if(!btn) return;
  var t=document.documentElement.getAttribute("data-theme");
  btn.textContent = t==="dark" ? "☀️" : "🌙";
  if(anim){ btn.classList.remove("spin-once"); void btn.offsetWidth; btn.classList.add("spin-once"); }
}

/* ═══ เข้าสู่ระบบ ═══ */
function doLogin(){
  var u=document.getElementById("lgUser").value.trim();
  var p=document.getElementById("lgPass").value;
  var err=document.getElementById("lgErr");
  var btn=document.getElementById("lgBtn");
  err.textContent="";
  if(!u || !p){ err.textContent="กรอกชื่อผู้ใช้และรหัสผ่านให้ครบ"; return; }
  btn.disabled=true; btn.textContent="กำลังเข้าสู่ระบบ…";
  fetch(API_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ action:"login", username:u, password:p, device:deviceId() }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      btn.disabled=false; btn.textContent="เข้าสู่ระบบ";
      if(!r.ok){
        var MSG={ notfound:"ไม่พบบัญชีนี้", disabled:"บัญชีถูกระงับการใช้งาน", wrongpass:"รหัสผ่านไม่ถูกต้อง",
                   deviceused:"บัญชีนี้ผูกกับเครื่องอื่นไปแล้ว — ให้ครูกด “รีเซ็ตเครื่อง” ให้ที่เมนูบัญชี",
                   nodevice:"เกิดข้อผิดพลาด ลองรีเฟรชหน้าเว็บแล้วลองใหม่" };
        err.textContent = MSG[r.reason] || r.error || "เข้าสู่ระบบไม่สำเร็จ";
        return;
      }
      var sess={ username:r.username, role:r.role, displayName:r.displayName };
      saveSession(sess); S.session=sess;
      showApp();
    })
    .catch(function(){ btn.disabled=false; btn.textContent="เข้าสู่ระบบ"; err.textContent="เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต"; });
}
function showGate(){
  document.getElementById("app").hidden=true;
  document.getElementById("gate").hidden=false;
  document.getElementById("lgBtn").onclick=doLogin;
  document.getElementById("lgPass").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
}
function showApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  S.tab="feed";
  render();
  refreshAll();
  document.getElementById("logoutBtn").onclick=A.logout;
  document.getElementById("themeBtn").onclick=A.toggleTheme;
  updateThemeIcon(false);
  var ib=document.getElementById("installBtn");
  if(ib){ ib.hidden = isStandalone() || !deferredPrompt; ib.onclick=doInstall; }
}

function boot(){
  if(API_URL.indexOf("PASTE_YOUR_APPS_SCRIPT")===0){
    document.body.innerHTML='<div style="padding:40px 24px;text-align:center;font-family:sans-serif;color:#B60D18;">'+
      '⚠️ ยังไม่ได้ตั้งค่า API_URL<br><br>เปิดไฟล์ index.html แล้วแก้ตัวแปร API_URL ในแท็ก &lt;script&gt;<br>ให้เป็นลิงก์ Web app ที่ได้จาก Google Apps Script (ดู README-setup.md)</div>';
    return;
  }
  var sess=loadSession();
  if(sess){ S.session=sess; showApp(); }
  else showGate();
}

/* ═══ ติดตั้งลงหน้าจอโฮม ═══ */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); deferredPrompt=e;
  var ib=document.getElementById("installBtn"); if(ib && S.session) ib.hidden=false;
});
window.addEventListener("appinstalled",function(){ deferredPrompt=null; var ib=document.getElementById("installBtn"); if(ib) ib.hidden=true; });
function isStandalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true;
}
function isIOSDevice(){
  var ua=navigator.userAgent||"";
  return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1);
}
function doInstall(){
  if(isIOSDevice()){
    alert("วิธีติดตั้งลงหน้าจอโฮม (iPhone/iPad):\n1) แตะปุ่มแชร์ (กรอบสี่เหลี่ยมมีลูกศรชี้ขึ้น) แถบด้านล่างของ Safari\n2) เลื่อนลงแล้วเลือก “เพิ่มไปยังหน้าจอโฮม”\n3) แตะ “เพิ่ม”");
    return;
  }
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){ deferredPrompt=null; });
}

boot();

if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
