<html lang="th">
<head>
<meta charset="utf-8">

<title>ห้องเรียนของเรา</title>
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ห้องเรียน">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
  /* ใช้ธีมที่บันทึกไว้ก่อนวาดหน้า กันจอกระพริบตอนโหลด */
  (function(){
    try{
      var t = localStorage.getItem('room_theme_v1');
      if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<style>
  :root{
    --pri:#6C5CE7; --priD:#5847D1; --pri-soft:#EFEBFF;
    --accent:#FF7A6B; --accent-soft:#FFEDEA;
    --good:#1FB781; --good-soft:#E3FBF1;
    --bg:#F6F5FC; --surface:#FFFFFF; --surface-2:#F1EFFB; --border:#E7E4F6;
    --text:#1B1730; --text-muted:#6B6784; --text-subtle:#9F9BB8;
    --on-btn:#FFFFFF;
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --pri:#8B7FFF; --priD:#7A6BFF; --pri-soft:#2A2555;
    --accent:#FF9689; --accent-soft:#3A2333;
    --good:#3FE0A5; --good-soft:#173B33;
    --bg:#121026; --surface:#1B1832; --surface-2:#221E3E; --border:#2C2850;
    --text:#EEEBFB; --text-muted:#B2AED4; --text-subtle:#7D79A6;
    --on-btn:#FFFFFF;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:'Anuphan',system-ui,sans-serif; color:var(--text); background:var(--bg);
    -webkit-text-size-adjust:100%; transition:background-color .25s ease, color .25s ease; }
  input,select,textarea,button{ font-family:inherit; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  @keyframes fadeUp{ from{ transform:translateY(10px); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes scaleIn{ from{ opacity:0; transform:scale(.92); } to{ opacity:1; transform:scale(1); } }
  @keyframes logoPop{ from{ transform:scale(.4) rotate(-14deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }
  @keyframes blobFloat{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(18px,-14px) scale(1.08); } }
  @keyframes spin180{ from{ transform:rotate(0); } to{ transform:rotate(180deg); } }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(108,92,231,.38); } 50%{ box-shadow:0 0 0 7px rgba(108,92,231,0); } }
  .fade-in{ animation:fadeUp .32s cubic-bezier(.2,.8,.2,1) both; }
  .scale-in{ animation:scaleIn .18s cubic-bezier(.2,.8,.2,1); }
  .spin-once{ animation:spin180 .35s ease; }
  @media (prefers-reduced-motion:reduce){
    *,.fade-in,.scale-in,.spin-once,body{ animation:none !important; transition:none !important; }
  }

  .shell{ max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .statusbar{ flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 18px;
    height:54px; padding-top:env(safe-area-inset-top); }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .dot{ width:34px; height:34px; border-radius:11px; background:linear-gradient(135deg,var(--pri),var(--priD));
    color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:15px;
    box-shadow:0 4px 12px rgba(108,92,231,.35); }
  .brand .nm{ font-size:14px; font-weight:700; }
  .brand .role{ font-size:10.5px; color:var(--text-muted); }
  .iconbtn{ width:36px; height:36px; border-radius:11px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .15s ease; }
  .iconbtn:active{ transform:scale(.9); }
  .tabhead{ flex:none; padding:2px 18px 12px; }
  .tabhead h1{ margin:2px 0 0; font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .kicker{ font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--pri); text-transform:uppercase; }
  .view{ flex:1; overflow-y:auto; padding:2px 16px 24px; -webkit-overflow-scrolling:touch; }
  .stack{ display:flex; flex-direction:column; gap:12px; }
  .navwrap{ flex:none; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); position:sticky; bottom:0; overflow:hidden;
    background:linear-gradient(180deg,rgba(246,245,252,0) 0%,var(--bg) 42%); }
  .navbar{ max-width:100%; background:linear-gradient(135deg,var(--pri),var(--priD)); border-radius:999px; display:flex; align-items:center; padding:5px; gap:4px;
    overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch; touch-action:pan-x;
    box-shadow:0 10px 28px rgba(108,92,231,.30); }
  .navbar::-webkit-scrollbar{ display:none; }
  .navbtn{ flex:0 0 auto; min-width:74px; min-height:44px; text-align:center; white-space:nowrap; cursor:pointer; border-radius:999px; padding:10px 12px 12px;
    font-size:12px; font-weight:600; color:rgba(255,255,255,.82); border:none; background:transparent; position:relative; scroll-snap-align:center;
    transition:background .18s ease, color .18s ease, transform .15s ease; }
  .navbtn::after{ content:""; position:absolute; left:50%; bottom:6px; width:17px; height:3px; border-radius:999px; background:currentColor;
    transform:translateX(-50%) scaleX(.25); opacity:0; transition:opacity .18s ease, transform .18s ease; }
  .navbtn.on{ background:var(--surface); color:var(--pri); font-weight:700; box-shadow:0 2px 8px rgba(14,15,18,.18); }
  .navbtn.on::after{ opacity:1; transform:translateX(-50%) scaleX(1); }
  .navbtn:active{ transform:scale(.97); }
  .navbtn:focus-visible{ outline:3px solid rgba(255,255,255,.8); outline-offset:2px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px; transition:background .25s ease, border-color .25s ease; }
  .lbl{ font-size:12px; font-weight:600; letter-spacing:.05em; color:var(--text-muted); text-transform:uppercase; }
  .muted{ font-size:12px; color:var(--text-muted); }
  .btn{ padding:11px 16px; border-radius:12px; border:none; background:linear-gradient(135deg,var(--pri),var(--priD));
    color:var(--on-btn); font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 6px 16px rgba(108,92,231,.30);
    transition:transform .12s ease; }
  .btn:active{ transform:scale(.96); }
  .btn.ghost{ border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:600; box-shadow:none; }
  .btn.sm{ padding:7px 12px; font-size:12.5px; border-radius:9px; font-weight:600; }
  .btn.danger{ background:var(--surface); color:var(--accent); border:1px solid var(--accent-soft); box-shadow:none; }
  .btn.danger-solid{ background:linear-gradient(135deg,#FF7A6B,#E4544A); color:#fff; box-shadow:0 6px 16px rgba(255,122,107,.30); }
  .btn:disabled{ opacity:.45; pointer-events:none; }
  .in{ border:1px solid var(--border); border-radius:11px; padding:11px 12px; font-size:15px; background:var(--surface);
    color:var(--text); width:100%; transition:border-color .15s ease, box-shadow .15s ease; }
  .in:focus{ outline:none; border-color:var(--pri); box-shadow:0 0 0 4px var(--pri-soft); }
  textarea.in{ min-height:78px; resize:vertical; }
  .chip{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .x{ width:30px; height:30px; flex:none; border-radius:9px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); cursor:pointer; font-size:13px; transition:transform .12s ease; }
  .x:active{ transform:scale(.88); }
  .row{ display:flex; align-items:center; gap:8px; }

  .gate{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
    max-width:420px; margin:0 auto; padding:28px 24px calc(28px + env(safe-area-inset-bottom));
    background:var(--bg); position:relative; overflow:hidden; }
  .gate::before,.gate::after{ content:""; position:absolute; width:320px; height:320px; border-radius:50%;
    filter:blur(64px); opacity:.32; z-index:0; animation:blobFloat 11s ease-in-out infinite; }
  .gate::before{ background:var(--pri); top:-110px; left:-90px; }
  .gate::after{ background:var(--accent); bottom:-130px; right:-100px; animation-delay:-5s; }
  .gate > *{ position:relative; z-index:1; }
  .gate .logo{ width:78px; height:78px; border-radius:23px; background:linear-gradient(135deg,var(--pri),var(--priD));
    color:#fff; font-weight:800; font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
    box-shadow:0 16px 36px rgba(108,92,231,.35); animation:logoPop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .gate h1{ margin:0; font-size:22px; font-weight:800; text-align:center; }
  .gate .sub{ margin:8px 0 22px; font-size:13.5px; color:var(--text-muted); text-align:center; line-height:1.55; }
  .gate .err{ font-size:13px; color:var(--accent); font-weight:700; margin-top:10px; text-align:center; min-height:19px; }

  .sheet{ position:fixed; inset:0; z-index:60; background:rgba(10,9,20,.5); display:flex; flex-direction:column; justify-content:flex-end; }
  .sheet.modal-center{ justify-content:center; align-items:center; padding:20px; }
  .sheetin{ background:var(--bg); border-radius:22px 22px 0 0; max-height:92%; display:flex; flex-direction:column; overflow:hidden;
    max-width:460px; width:100%; margin:0 auto; animation:fadeUp .22s ease-out; padding-bottom:env(safe-area-inset-bottom); }
  .modal-card{ border-radius:22px; max-width:360px; }
  .sheethead{ padding:16px 18px; border-bottom:1px solid var(--border); background:var(--surface); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .sheetbody{ padding:16px 18px; overflow-y:auto; }

  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom));
    background:var(--text); color:var(--bg); font-size:13px; font-weight:600; padding:11px 18px; border-radius:999px;
    z-index:90; box-shadow:0 8px 24px rgba(0,0,0,.3); animation:fadeUp .2s ease-out; max-width:88%; text-align:center; }

  .empty{ text-align:center; padding:34px 16px; color:var(--text-muted); }
  .empty .ic{ font-size:32px; margin-bottom:8px; }
  .pinned{ border-color:var(--accent); background:var(--accent-soft); }
  .bar{ height:9px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .bar > div{ height:100%; background:linear-gradient(90deg,var(--pri),var(--priD)); border-radius:999px; transition:width .4s ease; }
  .optbtn{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:12px 13px; border-radius:12px;
    border:1.5px solid var(--border); background:var(--surface); font-size:14px; cursor:pointer; margin-bottom:8px; color:var(--text);
    transition:transform .1s ease, border-color .15s ease; }
  .optbtn:active{ transform:scale(.98); }
  select.in{ -webkit-appearance:none; appearance:none; }

  /* ตารางเรียน */
  .sched-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .sched-title{ font-size:14px; font-weight:700; line-height:1.4; }
  .sched-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:16px; background:var(--surface); }
  .sched-table{ border-collapse:collapse; width:100%; font-size:11.5px; }
  .sched-table th,.sched-table td{ padding:8px 10px; text-align:center; border-bottom:1px solid var(--border);
    border-right:1px solid var(--border); white-space:pre-line; line-height:1.5; min-width:78px; }
  .sched-table th{ background:var(--surface-2); font-weight:700; color:var(--text-muted); font-size:11px; }
  .sched-time{ font-size:9.5px; color:var(--text-subtle); font-weight:500; margin-top:1px; }
  .sched-corner{ position:sticky; left:0; z-index:2; min-width:56px; }
  .sched-day{ position:sticky; left:0; background:var(--surface); font-weight:700; z-index:1; border-right:1.5px solid var(--border); }
  tr.sched-today .sched-day{ background:var(--pri-soft); color:var(--pri); }
  tr.sched-today td{ background:rgba(108,92,231,.05); }
  .sched-blank{ color:var(--text-subtle); }
  .sched-now{ position:relative; background:var(--pri-soft) !important; font-weight:700; color:var(--pri);
    border-radius:9px; animation:glowPulse 2.2s ease-in-out infinite; }
  .day-pill{ padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600; border:1px solid var(--border);
    background:var(--surface); color:var(--text); cursor:pointer; flex:none; }
  .day-pill.on{ background:linear-gradient(135deg,var(--pri),var(--priD)); color:#fff; border-color:transparent; }
  .period-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .period-row .no{ width:26px; flex:none; font-size:12px; font-weight:700; color:var(--text-muted); text-align:center; }
  .navdot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-left:3px; vertical-align:top; }
  .letter-card{ position:relative; overflow:hidden; border-color:rgba(108,92,231,.22); }
  .letter-card::after{ content:"✉"; position:absolute; right:13px; top:8px; font-size:34px; opacity:.12; transform:rotate(8deg); }
  .letter-meta{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .seal{ background:var(--accent-soft); color:var(--accent); }
  .opened{ background:var(--good-soft); color:var(--good); }
  .count-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; margin-top:13px; }
  .count-unit{ background:var(--surface-2); border-radius:12px; padding:9px 4px; text-align:center; }
  .count-num{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; color:var(--pri); line-height:1.15; }
  .count-lbl{ font-size:9px; color:var(--text-muted); margin-top:3px; font-weight:700; letter-spacing:.04em; }
  @media(max-width:380px){ .navbtn{ min-width:68px; font-size:11.5px; padding-left:10px; padding-right:10px; } }
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="logo" id="gateLogo">ห</div>
  <h1 id="gateTitle">ห้องเรียนของเรา</h1>
  <p class="sub">เข้าสู่ระบบด้วยบัญชีที่หัวหน้าสร้างให้<br>ถ้ายังไม่มีบัญชี ให้ติดต่อหัวหน้าห้อง</p>
  <div class="stack">
    <input class="in" id="lgUser" placeholder="ชื่อผู้ใช้" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input class="in" id="lgPass" placeholder="รหัสผ่าน" type="password" autocomplete="current-password">
    <button class="btn" id="lgBtn" type="button" style="padding:13px;font-size:15px;">เข้าสู่ระบบ</button>
  </div>
  <div class="err" id="lgErr"></div>
</div>

<div class="shell" id="app" hidden>
  <div class="statusbar">
    <div class="brand">
      <div class="dot">ห</div>
      <div>
        <div class="nm" id="whoName"></div>
        <div class="role" id="whoRole"></div>
      </div>
    </div>
    <div class="row">
      <button class="iconbtn" id="installBtn" hidden title="ติดตั้งลงหน้าจอ">⤓</button>
      <button class="iconbtn" id="pushBtn" title="เปิด/ปิดการแจ้งเตือน">🔕</button>
      <button class="iconbtn" id="themeBtn" title="สลับธีมมืด/สว่าง">🌙</button>
      <button class="iconbtn" id="logoutBtn" title="ออกจากระบบ">⎋</button>
    </div>
  </div>
  <div class="tabhead">
    <div class="kicker" id="kicker"></div>
    <h1 id="tabtitle"></h1>
  </div>
  <main class="view" id="view"></main>
  <div class="navwrap"><div class="navbar" id="nav"></div></div>
</div>

<div id="overlays"></div>

function deviceId(){
  var d=null;
  try{ d=localStorage.getItem(DEV_KEY); }catch(e){}
  if(!d){
    var a=new Uint8Array(12);
    (window.crypto||window.msCrypto).getRandomValues(a);
    d=""; for(var i=0;i<a.length;i++){ var h=a[i].toString(16); d+=(h.length<2?"0":"")+h; }
    try{ localStorage.setItem(DEV_KEY,d); }catch(e){}
  }
  return d;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function relDate(iso){
  var d=new Date(iso); if(isNaN(d)) return "";
  var s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return "เมื่อครู่นี้";
  if(s<3600) return Math.floor(s/60)+" นาทีที่แล้ว";
  if(s<86400) return Math.floor(s/3600)+" ชม.ที่แล้ว";
  if(s<2592000) return Math.floor(s/86400)+" วันที่แล้ว";
  return d.getDate()+"/"+(d.getMonth()+1)+"/"+(d.getFullYear()+543);
}
function parseTimeRange(str){
  var m = String(str||"").match(/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/);
  if(!m) return null;
  return { s:(+m[1])*60+(+m[2]), e:(+m[3])*60+(+m[4]) };
}
function isNowInRange(str,nowMin){ var r=parseTimeRange(str); return r ? (nowMin>=r.s && nowMin<=r.e) : false; }

function fmtDur(ms){
  ms=Math.max(0,ms);
  var s=Math.floor(ms/1000), h=Math.floor(s/3600); s%=3600;
  var m=Math.floor(s/60); s%=60;
  return (h>0?h+" ชม. ":"")+(m>0||h>0?m+" นาที ":"")+s+" วิ";
}

function runRefresh(key, task){

  return S.refreshing[key];
}

function refreshList(key, action, tab, apply){
  return runRefresh(key,function(){
    return api(action,{}).then(function(r){
      var before;
      if(r.ok){
        before=JSON.stringify(apply.get());
        apply.set(r);
        if(S.tab===tab && before!==JSON.stringify(apply.get())) render();
      }
      return r;
    });
  });
}

/* เทียบของล่าสุดที่ดึงมากับ "ครั้งล่าสุดที่เคยเปิดดูแท็บนั้น" — ถ้ามีของใหม่กว่าและไม่ได้อยู่แท็บนั้นอยู่ ให้ขึ้นจุดแดง */
function checkNew(){
  var map={ ann:latestOf(S.announcements), poll:latestOf(S.polls), feed:latestOf(S.posts) };
  Object.keys(map).forEach(function(k){
    if(map[k] && (!S.lastSeen[k] || map[k] > S.lastSeen[k]) && S.tab!==k) S.hasNew[k]=true;
  });
}
function markSeen(tab){
  var map={ ann:latestOf(S.announcements), poll:latestOf(S.polls), feed:latestOf(S.posts) };
  if(map[tab]!=null){ S.lastSeen[tab]=map[tab]; saveLastSeen(S.lastSeen); }
  S.hasNew[tab]=false;
}

  }
  var todayIdx = (new Date().getDay()+6)%7; // 0=จันทร์..6=อาทิตย์

  var h = '<div class="card sched-head fade-in">'+
      '<div class="sched-title">'+esc(sc.title)+'</div>'+

    h += '<th>คาบ '+(pi+1)+'<div class="sched-time mono">'+esc(p.time)+'</div></th>';
  });
  h += '</tr></thead><tbody>';

      h += '<td class="'+(live?"sched-now":"")+'">'+(text?esc(text):'<span class="sched-blank">—</span>')+'</td>';

}

/* ── คอยน์: เปิดกล่องสุ่มรายวัน / อันดับ / ปล้นคอยน์ ── */
function viewCoins(){
  var c = S.coins||{top:[],myTotal:0,myLastClaim:null,myLastRob:null};
  var now = Date.now();
  var lastCD = c.myLastClaim ? new Date(c.myLastClaim) : null;
  var lastRD = c.myLastRob ? new Date(c.myLastRob) : null;
  var COOLDOWN_MS = 24*60*60*1000; // คูลดาวน์จริง 24 ชม. นับจากครั้งล่าสุด ไม่ใช่ตามเที่ยงคืน (ต้องตรงกับฝั่ง Code.gs)

  var claimRemain = lastCD ? Math.max(0, COOLDOWN_MS - (now - lastCD.getTime())) : 0;

  var claimReady = claimRemain <= 0;

  h+='<div class="card fade-in">'+

        : '<button class="btn ghost" style="width:100%;padding:14px;font-size:14px;" disabled>เปิดได้อีกครั้งใน '+fmtDur(claimRemain)+'</button>')+
      '<div class="muted" style="margin-top:8px;text-align:center;line-height:1.6;">โอกาสได้: 1 คอยน์ 35% · 2 คอยน์ 30% · 3 คอยน์ 20% · 4 คอยน์ 10% · 5 คอยน์ 5%</div>'+
    '</div>';

  h+='<div class="card fade-in"><div style="font-size:14px;font-weight:700;margin-bottom:10px;">🏆 อันดับคอยน์เดือนนี้</div>';
  if(!c.top || !c.top.length || c.top.every(function(x){return x.coins===0;})){
    h+='<div class="muted" style="text-align:center;padding:10px 0;">ยังไม่มีใครสะสมคอยน์เดือนนี้</div>';
  } else {
    var medals=["🥇","🥈","🥉","4.","5."];
    h+='<div style="display:flex;flex-direction:column;gap:9px;">'+
      c.top.map(function(u,i){
        return '<div class="row" style="justify-content:space-between;">'+
          '<span style="font-size:13.5px;">'+medals[i]+' '+esc(u.displayName)+'</span>'+
          '<span class="mono" style="font-weight:700;color:var(--pri);">'+u.coins+' 🪙</span>'+
        '</div>';
      }).join("")+
    '</div>';
  }
  h+='</div>';

  h+='<div class="card fade-in">'+
      '<div style="font-size:14px;font-weight:700;margin-bottom:4px;">😈 ปล้นคอยน์</div>'+
      '<div class="muted" style="margin-bottom:10px;">ปล้นได้วันละ 1 ครั้ง ครั้งละ 1 คอยน์'+(!robReady?' · ปล้นได้อีกครั้งใน '+fmtDur(robRemain):'')+'</div>';
  if(!S.robTargets || !S.robTargets.length){
    h+='<div class="muted" style="text-align:center;padding:10px 0;">ยังไม่มีเพื่อนร่วมห้องคนอื่น</div>';
  } else {

      S.robTargets.map(function(u){

          '<div><div style="font-size:13.5px;font-weight:600;">'+esc(u.displayName)+'</div>'+

        '</div>';
      }).join("")+

  return '<div class="stack">'+h+'</div>';

/* ── บัญชีผู้ใช้ (แอดมิน) ── */
function displayDateTime(iso){
  var d=new Date(iso); if(isNaN(d)) return "ไม่ระบุเวลา";
  return d.toLocaleString("th-TH",{dateStyle:"medium",timeStyle:"short"});
}
function localDateTimeInput(iso){
  var d=new Date(iso); if(isNaN(d)) return "";
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function localInputToIso(value){
  var d=new Date(value);
  return isNaN(d) ? String(value||"") : d.toISOString();
}
function countdownParts(iso){
  var left=Math.max(0,new Date(iso).getTime()-Date.now());
  var s=Math.floor(left/1000), d=Math.floor(s/86400); s%=86400;
  var h=Math.floor(s/3600); s%=3600; var m=Math.floor(s/60); s%=60;
  return {d:d,h:h,m:m,s:s,done:left===0};
}
function letterCard(letter, mine, i){
  var open=letter.status==="opened";
  var h='<div class="card letter-card fade-in"'+stagger(i||0)+'>'+ 
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'+
      '<div style="font-size:15px;font-weight:700;line-height:1.35;flex:1;min-width:0;">'+esc(letter.title)+'</div>'+
      '<span class="chip '+(open?"opened":"seal")+'">'+(open?"เปิดผนึกแล้ว":"ปิดผนึก")+'</span>'+ 
    '</div>';
  if(open) h+='<div style="font-size:13.5px;line-height:1.75;white-space:pre-wrap;margin-top:9px;">'+esc(letter.body||"")+'</div>';
  else h+='<div class="muted" style="line-height:1.6;margin-top:8px;">เนื้อหาจะเปิดเผยเมื่อถึงเวลาที่ผู้เขียนกำหนด</div>';
  h+='<div class="letter-meta"><div class="muted">'+(open?"เปิดเมื่อ":"จะเปิด ")+displayDateTime(letter.unlockAt)+'</div>'+
      (mine?'<button class="btn sm danger" onclick="A.del(\'deleteMyTimeLetter\',\''+letter.id+'\')">ลบ</button>':'')+'</div></div>';
  return h;
}

/* ═══ Push Notification (Firebase Cloud Messaging) ═══ */
var fcmReady=false, fcmMessaging=null;
function fcmConfigured(){ return FIREBASE_CONFIG.apiKey.indexOf("PASTE_")!==0; }
function initPush(){
  if(!fcmConfigured() || !("serviceWorker" in navigator) || !window.firebase) return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fcmMessaging = firebase.messaging();
    fcmMessaging.onMessage(function(payload){
      toast((payload.notification && payload.notification.title) || "มีการแจ้งเตือนใหม่");
      refreshForTab(S.tab);
    });
    fcmReady = true;
  }catch(e){}
  updatePushIcon();
}
function updatePushIcon(){
  var btn=document.getElementById("pushBtn"); if(!btn) return;
  if(!fcmConfigured()){ btn.style.opacity=".4"; btn.title="ยังไม่ได้ตั้งค่าระบบแจ้งเตือน"; btn.textContent="🔕"; return; }
  btn.style.opacity="1";
  var on = localStorage.getItem(PUSH_KEY)==="on";
  btn.textContent = on ? "🔔" : "🔕";
  btn.title = on ? "ปิดการแจ้งเตือน" : "เปิดการแจ้งเตือน";
}
function enablePush(){
  if(!fcmConfigured()){ toast("ยังไม่ได้ตั้งค่าระบบแจ้งเตือน"); return; }
  if(!fcmReady){ toast("ระบบแจ้งเตือนยังไม่พร้อม ลองรีเฟรชหน้าเว็บ"); return; }
  if(!("Notification" in window)){ toast("อุปกรณ์นี้ไม่รองรับการแจ้งเตือน"); return; }
  Notification.requestPermission().then(function(perm){
    if(perm!=="granted"){ toast("ไม่ได้อนุญาตการแจ้งเตือน"); return; }
    navigator.serviceWorker.ready.then(function(reg){
      fcmMessaging.getToken({ vapidKey:FCM_VAPID_KEY, serviceWorkerRegistration:reg })
        .then(function(token){
          if(!token){ toast("ขอโทเคนแจ้งเตือนไม่สำเร็จ"); return; }
          return api("registerPushToken",{token:token}).then(function(r){
            if(!r.ok){ toast(r.error||"เปิดการแจ้งเตือนไม่สำเร็จ"); return; }
            try{ localStorage.setItem(PUSH_KEY,"on"); }catch(e){}
            updatePushIcon(); toast("เปิดการแจ้งเตือนแล้ว 🔔");
          });
        }).catch(function(){ toast("เปิดการแจ้งเตือนไม่สำเร็จ — ลองใหม่อีกครั้ง"); });
    });
  });
}

/* ═══ รีเฟรชอัตโนมัติ (real-time แบบ polling) ═══ */
var autoRefreshTimer=null;
function startAutoRefresh(){
  stopAutoRefresh();
  autoRefreshTimer=setInterval(function(){

    if(S.composer||S.schedEdit||S.confirmDlg||S.resetPassDlg||S.setCoinsDlg||S.lootDlg||S.busy) return; // กำลังพิมพ์/ยืนยันอยู่ อย่าเพิ่งแทรก
    refreshForTab(S.tab);
  }, AUTO_REFRESH_MS);
}
function stopAutoRefresh(){ if(autoRefreshTimer){ clearInterval(autoRefreshTimer); autoRefreshTimer=null; } }
function refreshWhenReady(){
  if(!S.session || S.composer||S.schedEdit||S.confirmDlg||S.resetPassDlg||S.setCoinsDlg||S.lootDlg||S.busy) return;
  refreshForTab(S.tab);
}

});

window.addEventListener("online",refreshWhenReady);
/* นับถอยหลังแบบสด ๆ (เวลาปลดล็อกกล่องสุ่ม/ปล้นคอยน์) — วาดใหม่ทุก 1 นาทีเฉพาะตอนอยู่แท็บคอยน์
   (เดิมวาดใหม่ทุกวินาทีซึ่งถี่เกินความจำเป็น เพราะคูลดาวน์เป็นหลักชั่วโมง ไม่ต้องละเอียดระดับวินาที) */
var COINS_TICK_MS = 60000;
var coinsTickTimer=null;
function startCoinsTick(){
  stopCoinsTick();
  coinsTickTimer=setInterval(function(){
    if(S.tab==="coins" && !S.lootDlg && !S.confirmDlg && !S.setCoinsDlg) render();
  },COINS_TICK_MS);
}
function stopCoinsTick(){ if(coinsTickTimer){ clearInterval(coinsTickTimer); coinsTickTimer=null; } }

/* เคาท์ดาวน์ต้องแสดงวินาทีล่าสุด จึงวาดใหม่เฉพาะขณะที่อยู่ในแท็บเคาท์ดาวน์ */
var countdownTickTimer=null;
function startCountdownTick(){
  stopCountdownTick();
  countdownTickTimer=setInterval(function(){
    if(S.tab==="countdowns" && !S.composer && !S.confirmDlg && !S.busy) tickCountdowns();
  },1000);
}
function stopCountdownTick(){ if(countdownTickTimer){ clearInterval(countdownTickTimer); countdownTickTimer=null; } }
function tickCountdowns(){
  var partsById={};
  S.countdowns.forEach(function(c){ partsById[c.id]=countdownParts(c.targetAt); });
  var nodes=document.querySelectorAll(".count-num[data-countdown]");
  for(var i=0;i<nodes.length;i++){
    var node=nodes[i], p=partsById[node.getAttribute("data-countdown")];
    if(!p) continue;
    var unit=node.getAttribute("data-unit"), value=unit==="d"?p.d:String(p[unit]).padStart(2,"0");
    if(node.textContent!==String(value)) node.textContent=value;
  }
  Object.keys(partsById).forEach(function(id){
    if(partsById[id].done && !S.countdownReached[id]){ S.countdownReached[id]=true; renderViewOnly(); }
  });
}

/* ═══ เข้าสู่ระบบ ═══ */
function doLogin(){
  var u=document.getElementById("lgUser").value.trim();
  var p=document.getElementById("lgPass").value;
  var err=document.getElementById("lgErr");
  var btn=document.getElementById("lgBtn");
  err.textContent="";
  if(!u || !p){ err.textContent="กรอกชื่อผู้ใช้และรหัสผ่านให้ครบ"; return; }
  btn.disabled=true; btn.textContent="กำลังเข้าสู่ระบบ…";
  fetch(API_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ action:"login", username:u, password:p, device:deviceId() }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      btn.disabled=false; btn.textContent="เข้าสู่ระบบ";
      if(!r.ok){
        var MSG={ notfound:"ไม่พบบัญชีนี้", disabled:"บัญชีถูกระงับการใช้งาน", wrongpass:"รหัสผ่านไม่ถูกต้อง",
                   deviceused:"บัญชีนี้ผูกกับเครื่องอื่นไปแล้ว — ให้ครูกด “รีเซ็ตเครื่อง” ให้ที่เมนูบัญชี",
                   nodevice:"เกิดข้อผิดพลาด ลองรีเฟรชหน้าเว็บแล้วลองใหม่" };
        err.textContent = MSG[r.reason] || r.error || "เข้าสู่ระบบไม่สำเร็จ";
        return;
      }
      var sess={ username:r.username, role:r.role, displayName:r.displayName };
      saveSession(sess); S.session=sess;
      showApp();
    })
    .catch(function(){ btn.disabled=false; btn.textContent="เข้าสู่ระบบ"; err.textContent="เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต"; });
}
function showGate(){

  document.getElementById("gate").hidden=false;

function showApp(){

/* ═══ ติดตั้งลงหน้าจอโฮม ═══ */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault(); deferredPrompt=e;
  var ib=document.getElementById("installBtn"); if(ib && S.session) ib.hidden=false;
});
window.addEventListener("appinstalled",function(){ deferredPrompt=null; var ib=document.getElementById("installBtn"); if(ib) ib.hidden=true; });
function isStandalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true;
}
function isIOSDevice(){
  var ua=navigator.userAgent||"";
  return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1);
}
function doInstall(){
  if(isIOSDevice()){
    alert("วิธีติดตั้งลงหน้าจอโฮม (iPhone/iPad):\n1) แตะปุ่มแชร์ (กรอบสี่เหลี่ยมมีลูกศรชี้ขึ้น) แถบด้านล่างของ Safari\n2) เลื่อนลงแล้วเลือก “เพิ่มไปยังหน้าจอโฮม”\n3) แตะ “เพิ่ม”");
    return;
  }
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){ deferredPrompt=null; });
}

boot();

if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
